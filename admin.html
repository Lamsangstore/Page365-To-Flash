<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — ตรวจออเดอร์ & Export</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ธีมกลาง Lamsang (LAMSANG-THEME.md) — สีแบรนด์ทอง + แถบมืด
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#faf6ec', 100: '#f3ead4', 200: '#e7d5a8', 300: '#d9bf7d', 400: '#ccac60', 500: '#bf9c4f', 600: '#a8853f', 700: '#886a32', 800: '#6b5329', 900: '#4a3a1d' },
                        panel: { 700: '#3a3833', 800: '#2a2825', 900: '#1c1b19' }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="app-config.js"></script>
    <script src="postal-db.js"></script>
    <script src="order-core.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const C = window.OrderCore;
const CFG = window.APP_CONFIG;

firebase.initializeApp(CFG.firebase);
const db = firebase.firestore();
const auth = firebase.auth();

const STATUS = {
    pending:  { label: "รอตรวจ",    cls: "bg-amber-100 text-amber-700 border-amber-300" },
    verified: { label: "ตรวจแล้ว",  cls: "bg-sky-100 text-sky-700 border-sky-300" },
    exported: { label: "ส่งออกแล้ว", cls: "bg-emerald-100 text-emerald-700 border-emerald-300" }
};

/* ───────────────── ฟอร์มแก้ไขออเดอร์ ───────────────── */
const OrderForm = ({ initial, onSave, onCancel, saving }) => {
    const [form, setForm] = useState(() => initial ? C.orderToForm(initial) : C.emptyForm());
    const [showMissing, setShowMissing] = useState(false);

    const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const setItem = (idx, k, v) => setForm(f => ({ ...f, items: f.items.map((it, i) => i === idx ? { ...it, [k]: v } : it) }));
    const addItem = () => setForm(f => ({ ...f, items: [...f.items, { name: "", variant: "", size: "", qty: 1 }] }));
    const removeItem = (idx) => setForm(f => ({ ...f, items: f.items.length > 1 ? f.items.filter((_, i) => i !== idx) : f.items }));

    const postalEntry = form.postal.length === 5 ? C.POSTAL_DB[form.postal] : null;
    const addrLocked = form.postal.length !== 5;
    const districtOptions = postalEntry ? (postalEntry.d || []) : [];
    const subdistrictOptions = postalEntry ? (postalEntry.s || []) : [];

    const setPostal = (value) => {
        const postal = String(value).replace(/\D/g, "").slice(0, 5);
        setForm(f => {
            const next = { ...f, postal };
            if (postal.length === 5) {
                const e = C.POSTAL_DB[postal];
                if (e) {
                    const ds = e.d || [], ss = e.s || [];
                    next.province = e.p || "";
                    next.district = ds.length === 1 ? ds[0] : (ds.includes(f.district) ? f.district : "");
                    next.subdistrict = ss.length === 1 ? ss[0] : (ss.includes(f.subdistrict) ? f.subdistrict : "");
                    next.customDistrict = false; next.customSubdistrict = false;
                }
            } else if (f.postal.length === 5) {
                next.province = ""; next.district = ""; next.subdistrict = "";
                next.customDistrict = false; next.customSubdistrict = false;
            }
            return next;
        });
    };
    const setSelectField = (field, customFlag, value) => {
        if (value === C.CUSTOM) setForm(f => ({ ...f, [field]: "", [customFlag]: true }));
        else setForm(f => ({ ...f, [field]: value }));
    };

    const missing = C.getMissing(form);
    const missingLabels = C.missingLabelsOf(missing);
    const markCls = (key, base) => base + (showMissing && missing[key] ? " !border-red-400 !bg-red-50" : "");

    const inputCls = "w-full px-3 py-2.5 rounded-xl border-2 border-slate-200 outline-none font-bold text-slate-700 bg-white text-sm transition-all focus:border-brand-600";
    const numCls = "w-full px-1 py-2.5 rounded-xl border-2 border-slate-200 outline-none font-bold text-slate-700 bg-white text-sm text-center transition-all focus:border-brand-600";

    const save = () => {
        if (missingLabels.length > 0) { setShowMissing(true); return; }
        onSave(C.formToOrder(form));
    };

    return (
        <div className="bg-slate-50 border-2 border-slate-300 rounded-2xl p-5 space-y-4">
            <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                <div>
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">เลขออเดอร์</label>
                    <input value={form.no} onChange={e => setField('no', e.target.value)} className={inputCls}/>
                </div>
                <div className="md:col-span-3">
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ชื่อผู้รับ *</label>
                    <input value={form.customerName} onChange={e => setField('customerName', e.target.value)} className={markCls('customerName', inputCls)}/>
                </div>
                <div className="md:col-span-2">
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">เบอร์โทร *</label>
                    <input value={form.phone} onChange={e => setField('phone', e.target.value)} className={markCls('phone', inputCls)}/>
                </div>

                <div>
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ไปรษณีย์ *</label>
                    <input value={form.postal} onChange={e => setPostal(e.target.value)} maxLength={5} className={markCls('postal', inputCls) + " tracking-widest"}/>
                </div>
                <div>
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">จังหวัด *</label>
                    <select value={form.province} onChange={e => setField('province', e.target.value)} disabled={addrLocked || !!postalEntry}
                        className={markCls('province', inputCls) + " appearance-none disabled:bg-slate-100 disabled:text-slate-400"}>
                        <option value="">{addrLocked ? "— ใส่ไปรษณีย์ก่อน —" : "— เลือก —"}</option>
                        {(postalEntry ? [postalEntry.p] : C.ALL_PROVINCES).map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                </div>
                <div>
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">อำเภอ/เขต *</label>
                    {addrLocked ? (
                        <select disabled className={markCls('district', inputCls) + " appearance-none disabled:bg-slate-100 disabled:text-slate-400"}><option>—</option></select>
                    ) : (!form.customDistrict && districtOptions.length > 0) ? (
                        <select value={form.district} onChange={e => setSelectField('district', 'customDistrict', e.target.value)} className={markCls('district', inputCls) + " appearance-none"}>
                            <option value="">— เลือก —</option>
                            {districtOptions.map(d => <option key={d} value={d}>{form.province === "กรุงเทพมหานคร" ? `เขต${d}` : d}</option>)}
                            <option value={C.CUSTOM}>+ พิมพ์เอง…</option>
                        </select>
                    ) : (
                        <input value={form.district} onChange={e => setField('district', e.target.value)} className={markCls('district', inputCls)}/>
                    )}
                </div>
                <div>
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ตำบล/แขวง *</label>
                    {addrLocked ? (
                        <select disabled className={markCls('subdistrict', inputCls) + " appearance-none disabled:bg-slate-100 disabled:text-slate-400"}><option>—</option></select>
                    ) : (!form.customSubdistrict && subdistrictOptions.length > 0) ? (
                        <select value={form.subdistrict} onChange={e => setSelectField('subdistrict', 'customSubdistrict', e.target.value)} className={markCls('subdistrict', inputCls) + " appearance-none"}>
                            <option value="">— เลือก —</option>
                            {subdistrictOptions.map(s => <option key={s} value={s}>{s}</option>)}
                            <option value={C.CUSTOM}>+ พิมพ์เอง…</option>
                        </select>
                    ) : (
                        <input value={form.subdistrict} onChange={e => setField('subdistrict', e.target.value)} className={markCls('subdistrict', inputCls)}/>
                    )}
                </div>
                <div className="col-span-2 md:col-span-2">
                    <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ที่อยู่ *</label>
                    <input value={form.addrLine} onChange={e => setField('addrLine', e.target.value)} className={markCls('addrLine', inputCls)}/>
                </div>
            </div>

            <div className="flex flex-wrap items-end gap-3 bg-white border-2 border-slate-200 rounded-xl p-3">
                <span className="text-[10px] font-black text-slate-400 uppercase w-full">📦 พัสดุ (ทั้งกล่อง)</span>
                <div><label className="block text-[10px] text-slate-400 font-black uppercase mb-1">น้ำหนัก *</label>
                    <input type="number" step="0.01" value={form.weight} onChange={e => setField('weight', e.target.value)} className={markCls('weight', numCls) + " w-24"}/></div>
                <div><label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ก × ย × ส *</label>
                    <div className="flex items-center gap-1">
                        <input type="number" value={form.width} onChange={e => setField('width', e.target.value)} className={markCls('width', numCls) + " w-16"}/>
                        <span className="text-slate-300">×</span>
                        <input type="number" value={form.length} onChange={e => setField('length', e.target.value)} className={markCls('length', numCls) + " w-16"}/>
                        <span className="text-slate-300">×</span>
                        <input type="number" value={form.height} onChange={e => setField('height', e.target.value)} className={markCls('height', numCls) + " w-16"}/>
                    </div></div>
                <div><label className="block text-[10px] text-slate-400 font-black uppercase mb-1">ประเภทสินค้า</label>
                    <select value={form.itemType} onChange={e => setField('itemType', e.target.value)} className={inputCls + " appearance-none w-40"}>
                        {C.ITEM_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                    </select></div>
                <div><label className="block text-[10px] text-slate-400 font-black uppercase mb-1">รูปแบบขนส่ง</label>
                    <select value={form.productType} onChange={e => setField('productType', e.target.value)} className={inputCls + " appearance-none w-44"}>
                        {C.PRODUCT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                    </select></div>
            </div>

            <div className={`flex flex-wrap items-center gap-3 border-2 rounded-xl px-3 py-2.5 ${form.isCod ? "bg-emerald-50 border-emerald-300" : "bg-white border-slate-200"}`}>
                <label className="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" checked={form.isCod}
                        onChange={e => setForm(f => ({ ...f, isCod: e.target.checked, amount: e.target.checked ? f.amount : "" }))}
                        className="w-4 h-4 accent-emerald-500 cursor-pointer"/>
                    <span className="font-black text-slate-700 text-sm">💰 COD</span>
                </label>
                {form.isCod && (
                    <input type="number" value={form.amount} onChange={e => setField('amount', e.target.value)} placeholder="0"
                        className={"w-32 px-3 py-2 rounded-lg border-2 outline-none font-black text-slate-800 bg-white " + (showMissing && missing.amount ? "border-red-400 bg-red-50" : "border-emerald-300")}/>
                )}
            </div>

            <div>
                <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">รายการสินค้า {form.isCod && "*"}</label>
                <div className="space-y-2">
                    {form.items.map((it, idx) => (
                        <div key={idx} className="grid grid-cols-1 md:grid-cols-[1fr_8rem_5rem_4rem_2.5rem] gap-2">
                            <input value={it.name} onChange={e => setItem(idx, 'name', e.target.value)} placeholder="ชื่อสินค้า" className={markCls('items', inputCls)}/>
                            <input value={it.variant} onChange={e => setItem(idx, 'variant', e.target.value)} placeholder="สี" className={inputCls}/>
                            <input value={it.size} onChange={e => setItem(idx, 'size', e.target.value)} placeholder="ขนาด" className={inputCls}/>
                            <input type="number" min="1" value={it.qty} onChange={e => setItem(idx, 'qty', e.target.value)} className={numCls}/>
                            <button onClick={() => removeItem(idx)} disabled={form.items.length === 1}
                                className="px-2 py-2 rounded-xl border-2 border-slate-200 text-slate-400 font-black hover:bg-red-50 hover:text-red-500 transition-all disabled:opacity-30">✕</button>
                        </div>
                    ))}
                </div>
                <button onClick={addItem} className="mt-2 px-4 py-1.5 rounded-lg border-2 border-slate-300 text-slate-600 font-black text-xs hover:bg-slate-100">+ เพิ่มสินค้า</button>
            </div>

            <div>
                <label className="block text-[10px] text-slate-400 font-black uppercase mb-1">หมายเหตุ</label>
                <input value={form.note} onChange={e => setField('note', e.target.value)} className={inputCls}/>
            </div>

            {showMissing && missingLabels.length > 0 && (
                <div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 text-red-700 font-bold text-xs">
                    ⚠️ ยังขาด: {missingLabels.join(" · ")}
                </div>
            )}

            <div className="flex gap-3">
                <button onClick={save} disabled={saving} className="px-8 py-3 rounded-xl bg-brand-600 text-white font-black hover:bg-brand-700 transition-all shadow disabled:opacity-50">
                    {saving ? "กำลังบันทึก…" : "💾 บันทึก"}
                </button>
                <button onClick={onCancel} className="px-6 py-3 rounded-xl border-2 border-slate-300 text-slate-500 font-black hover:bg-slate-100">ยกเลิก</button>
            </div>
        </div>
    );
};

/* ───────────────── หน้าแอดมิน ───────────────── */
const App = () => {
    const [user, setUser] = useState(undefined);   // undefined = ยังไม่รู้, null = ยังไม่ล็อกอิน
    const [orders, setOrders] = useState([]);
    const [loadErr, setLoadErr] = useState("");
    const [filter, setFilter] = useState("pending");
    const [carrier, setCarrier] = useState("flash");
    const [selected, setSelected] = useState(new Set());
    const [editingId, setEditingId] = useState(null);
    const [adding, setAdding] = useState(false);
    const [saving, setSaving] = useState(false);
    const [dialog, setDialog] = useState(null);

    const askConfirm = (title, message, onConfirm, opts = {}) =>
        setDialog({ title, message, onConfirm, confirmLabel: opts.confirmLabel || "ยืนยัน", danger: opts.danger !== false });
    const showInfo = (title, message) => setDialog({ title, message, onConfirm: null, confirmLabel: "ตกลง", danger: false });

    useEffect(() => auth.onAuthStateChanged(u => setUser(u)), []);

    useEffect(() => {
        if (!user) { setOrders([]); return; }
        return db.collection("orders").orderBy("createdAt", "desc").limit(500)
            .onSnapshot(
                snap => { setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoadErr(""); },
                err => setLoadErr(err.code === "permission-denied"
                    ? "บัญชีนี้ไม่มีสิทธิ์อ่านข้อมูล — ตรวจว่าใส่อีเมลไว้ใน firestore.rules แล้ว"
                    : err.message)
            );
    }, [user]);

    const isAdmin = user && (CFG.adminEmails || []).includes(user.email);
    const shown = orders.filter(o => filter === "all" ? true : (o.status || "pending") === filter);
    const rowsFor = (list) => C.buildRowsForCarrier(list, carrier);
    const selectedOrders = shown.filter(o => selected.has(o.id));

    const counts = {
        pending: orders.filter(o => (o.status || "pending") === "pending").length,
        verified: orders.filter(o => o.status === "verified").length,
        exported: orders.filter(o => o.status === "exported").length,
        all: orders.length
    };

    const saveOrder = async (id, data) => {
        setSaving(true);
        try {
            await db.collection("orders").doc(id).update(Object.assign({}, data, {
                status: "verified",
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedBy: user.email
            }));
            setEditingId(null);
        } catch (e) { showInfo("บันทึกไม่สำเร็จ", e.message); }
        setSaving(false);
    };

    const addOrder = async (data) => {
        setSaving(true);
        try {
            await db.collection("orders").add(Object.assign({}, data, {
                no: data.no || String(Date.now()).slice(-6),
                status: "verified", source: "admin", uid: user.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedBy: user.email
            }));
            setAdding(false);
        } catch (e) { showInfo("เพิ่มไม่สำเร็จ", e.message); }
        setSaving(false);
    };

    const setStatus = (id, status) =>
        db.collection("orders").doc(id).update({ status, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: user.email });

    const removeOrder = (o) => askConfirm("ลบออเดอร์นี้?", `${o.no} · ${o.customerName}\n${o.address || ""}`,
        () => db.collection("orders").doc(o.id).delete(), { confirmLabel: "ลบออเดอร์" });

    const download = () => {
        if (!selectedOrders.length) { showInfo("ยังไม่ได้เลือกรายการ", "ติ๊กเลือกออเดอร์ที่จะส่งออกก่อน"); return; }
        const res = C.downloadRows(rowsFor(selectedOrders), carrier);
        askConfirm("ดาวน์โหลดแล้ว",
            carrier === "jt" ? `J&T ${res.non} รายการ` : `Flash — COD ${res.cod} รายการ · ไม่ใช่ COD ${res.non} รายการ (${res.files} ไฟล์)\n\nทำเครื่องหมายว่า "ส่งออกแล้ว" เลยไหม?`,
            () => selectedOrders.forEach(o => setStatus(o.id, "exported")),
            { confirmLabel: "ทำเครื่องหมายว่าส่งออกแล้ว", danger: false });
    };

    // ── ยังไม่ล็อกอิน ────────────────────────────────────────────
    if (user === undefined) return <div className="p-16 text-center text-slate-400 font-bold">กำลังโหลด…</div>;
    if (!user) {
        return (
            <div className="p-8 flex justify-center">
                <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 text-center mt-16">
                    <div className="text-6xl mb-3">🗂️</div>
                    <h1 className="text-2xl font-black text-slate-800 mb-2">Admin</h1>
                    <p className="text-slate-500 font-medium mb-8">เข้าสู่ระบบด้วยบัญชี Google ของแอดมิน</p>
                    <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
                        className="w-full px-8 py-4 rounded-2xl bg-brand-600 text-white font-black hover:bg-brand-700 transition-all shadow-lg">
                        เข้าสู่ระบบด้วย Google
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="p-4 md:p-8 flex justify-center">
            <div className="max-w-7xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200">

                <div className="p-6 bg-panel-900 flex flex-wrap items-center gap-4">
                    <h1 className="text-xl font-black text-white flex items-center gap-2"><span className="text-2xl">🗂️</span> ออเดอร์จากลูกค้า</h1>
                    <div className="flex-1"></div>
                    <span className="text-slate-400 font-bold text-xs">{user.email}</span>
                    <button onClick={() => auth.signOut()} className="px-4 py-2 rounded-xl bg-white/10 text-white font-bold text-xs hover:bg-white/20">ออกจากระบบ</button>
                </div>

                {!isAdmin && (
                    <div className="bg-amber-50 border-b-2 border-amber-300 p-4 text-amber-800 font-bold text-sm">
                        ⚠️ อีเมลนี้ไม่ได้อยู่ในรายชื่อแอดมิน (app-config.js) — ถ้าอ่านข้อมูลไม่ได้ ให้เพิ่มอีเมลใน firestore.rules ด้วย
                    </div>
                )}
                {loadErr && <div className="bg-red-50 border-b-2 border-red-300 p-4 text-red-700 font-bold text-sm">⚠️ {loadErr}</div>}

                {/* แถบเครื่องมือ */}
                <div className="p-5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center gap-3">
                    {["pending", "verified", "exported", "all"].map(k => (
                        <button key={k} onClick={() => { setFilter(k); setSelected(new Set()); }}
                            className={`px-4 py-2 rounded-xl font-black text-xs transition-all border-2 ${filter === k ? "bg-brand-600 text-white border-brand-600" : "bg-white text-slate-500 border-slate-200 hover:bg-slate-100"}`}>
                            {k === "all" ? "ทั้งหมด" : STATUS[k].label} ({counts[k]})
                        </button>
                    ))}
                    <div className="flex-1"></div>
                    <div className="flex rounded-xl overflow-hidden border-2 border-slate-200">
                        <button onClick={() => setCarrier("flash")} className={`px-4 py-2 font-black text-xs ${carrier === "flash" ? "bg-yellow-400 text-slate-900" : "bg-white text-slate-400"}`}>⚡ Flash</button>
                        <button onClick={() => setCarrier("jt")} className={`px-4 py-2 font-black text-xs ${carrier === "jt" ? "bg-red-500 text-white" : "bg-white text-slate-400"}`}>🚚 J&T</button>
                    </div>
                    <button onClick={() => setAdding(true)} className="px-4 py-2 rounded-xl border-2 border-slate-300 text-slate-600 font-black text-xs hover:bg-slate-100">+ เพิ่มออเดอร์เอง</button>
                    <button onClick={download} disabled={!selectedOrders.length}
                        className="px-6 py-2.5 rounded-xl bg-brand-600 text-white font-black text-sm hover:bg-brand-700 transition-all shadow disabled:opacity-40">
                        ⬇ Download Excel {selectedOrders.length > 0 && `(${selectedOrders.length})`}
                    </button>
                </div>

                <div className="p-5 space-y-3">
                    {adding && (
                        <OrderForm initial={null} saving={saving} onSave={addOrder} onCancel={() => setAdding(false)} />
                    )}

                    {shown.length > 0 && (
                        <label className="flex items-center gap-2 px-2 text-xs font-black text-slate-400 uppercase tracking-widest cursor-pointer select-none">
                            <input type="checkbox" checked={selected.size === shown.length && shown.length > 0}
                                onChange={e => setSelected(e.target.checked ? new Set(shown.map(o => o.id)) : new Set())}
                                className="w-4 h-4 accent-brand-600 cursor-pointer"/>
                            เลือกทั้งหมดในหน้านี้ ({shown.length})
                        </label>
                    )}

                    {shown.length === 0 && (
                        <div className="border-4 border-dashed border-slate-200 rounded-[2rem] p-16 text-center">
                            <div className="text-5xl mb-3">📭</div>
                            <p className="text-slate-400 font-bold">ยังไม่มีออเดอร์ในสถานะนี้</p>
                        </div>
                    )}

                    {shown.map(o => {
                        const row = rowsFor([o])[0];
                        const issues = C.validateRow(row, carrier);
                        const st = STATUS[o.status || "pending"];
                        const isEditing = editingId === o.id;
                        return (
                            <div key={o.id} className={`border-2 rounded-2xl transition-all ${issues.length ? "border-amber-300 bg-amber-50/30" : "border-slate-200 bg-white"}`}>
                                <div className="flex flex-wrap items-start gap-3 p-4">
                                    <input type="checkbox" checked={selected.has(o.id)}
                                        onChange={e => { const n = new Set(selected); e.target.checked ? n.add(o.id) : n.delete(o.id); setSelected(n); }}
                                        className="w-4 h-4 mt-1 accent-brand-600 cursor-pointer"/>
                                    <div className="flex-1 min-w-[260px]">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <span className="font-black text-slate-800">{o.no} · {o.customerName}</span>
                                            <span className="text-slate-400 font-bold text-sm">{o.phone}</span>
                                            <span className={`px-2 py-0.5 rounded-full border text-[10px] font-black uppercase ${st.cls}`}>{st.label}</span>
                                            {o.isCod && <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-black">COD {Number(o.amount).toLocaleString()} ฿</span>}
                                            {o.source === "customer" && <span className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 text-[10px] font-black">ลูกค้ากรอก</span>}
                                        </div>
                                        <div className="text-xs text-slate-500 font-medium mt-0.5">{o.address}</div>
                                        <div className="text-xs text-slate-400 font-bold mt-0.5">
                                            📦 {C.num(o.weight, 0).toFixed(2)} กก. · {C.num(o.width, 0)}×{C.num(o.length, 0)}×{C.num(o.height, 0)} ซม.
                                            {o.items && o.items.length ? " · " + o.items.map(i => `${i.qty}× ${i.name}${i.variant ? ` (${i.variant})` : ""}`).join(" · ") : ""}
                                        </div>
                                        {o.note && <div className="text-xs text-slate-500 font-bold mt-1">📝 {o.note}</div>}
                                        {issues.length > 0 && <div className="text-xs text-amber-700 font-black mt-1">⚠ {issues.join(" · ")}</div>}
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={() => setEditingId(isEditing ? null : o.id)} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-black text-xs hover:bg-slate-200">{isEditing ? "ปิด" : "แก้ไข"}</button>
                                        {(o.status || "pending") === "pending" && (
                                            <button onClick={() => setStatus(o.id, "verified")} className="px-3 py-1.5 rounded-lg bg-sky-100 text-sky-700 font-black text-xs hover:bg-sky-200">✓ ตรวจแล้ว</button>
                                        )}
                                        <button onClick={() => removeOrder(o)} className="px-3 py-1.5 rounded-lg bg-red-50 text-red-500 font-black text-xs hover:bg-red-100">ลบ</button>
                                    </div>
                                </div>
                                {isEditing && (
                                    <div className="px-4 pb-4">
                                        <OrderForm initial={o} saving={saving} onSave={(d) => saveOrder(o.id, d)} onCancel={() => setEditingId(null)} />
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            </div>

            {dialog && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 p-4" onClick={() => setDialog(null)}>
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8" onClick={e => e.stopPropagation()}>
                        <h3 className="text-xl font-black text-slate-800 mb-2">{dialog.title}</h3>
                        <p className="text-slate-500 font-medium text-sm whitespace-pre-line mb-7">{dialog.message}</p>
                        <div className="flex flex-wrap gap-3 justify-end">
                            {dialog.onConfirm && <button onClick={() => setDialog(null)} className="px-6 py-3 rounded-2xl border-2 border-slate-300 text-slate-500 font-black hover:bg-slate-100">ยกเลิก</button>}
                            <button autoFocus onClick={() => { const fn = dialog.onConfirm; setDialog(null); if (fn) fn(); }}
                                className={`px-6 py-3 rounded-2xl font-black text-white shadow-lg active:scale-95 ${dialog.danger ? "bg-red-500 hover:bg-red-400" : "bg-brand-600 hover:bg-brand-700"}`}>
                                {dialog.confirmLabel}
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
