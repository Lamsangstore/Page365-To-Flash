<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลจัดส่ง</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ธีมกลาง Lamsang (LAMSANG-THEME.md) — สีแบรนด์ทอง + แถบมืด
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#faf6ec', 100: '#f3ead4', 200: '#e7d5a8', 300: '#d9bf7d', 400: '#ccac60', 500: '#bf9c4f', 600: '#a8853f', 700: '#886a32', 800: '#6b5329', 900: '#4a3a1d' },
                        panel: { 700: '#3a3833', 800: '#2a2825', 900: '#1c1b19' }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="app-config.js"></script>
    <script src="postal-db.js"></script>
    <script src="order-core.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const C = window.OrderCore;
const CFG = window.APP_CONFIG;

firebase.initializeApp(CFG.firebase);
const db = firebase.firestore();
const auth = firebase.auth();

const App = () => {
    const [form, setForm] = useState(C.emptyForm);
    const [showMissing, setShowMissing] = useState(false);
    const [pasteText, setPasteText] = useState("");
    const [consent, setConsent] = useState(false);
    const [status, setStatus] = useState("idle");   // idle | sending | done | error
    const [errorMsg, setErrorMsg] = useState("");
    const [refNo, setRefNo] = useState("");
    const [ready, setReady] = useState(false);
    const topRef = useRef(null);

    // ล็อกอินแบบไม่ระบุตัวตน (ให้ Firestore rules ผูกออเดอร์กับผู้ส่งได้)
    useEffect(() => {
        auth.signInAnonymously()
            .then(() => setReady(true))
            .catch(e => { setErrorMsg("เชื่อมต่อระบบไม่ได้: " + e.message); setStatus("error"); });
    }, []);

    const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const setItem = (idx, k, v) => setForm(f => ({ ...f, items: f.items.map((it, i) => i === idx ? { ...it, [k]: v } : it) }));
    const addItem = () => setForm(f => ({ ...f, items: [...f.items, { name: "", variant: "", size: "", qty: 1 }] }));
    const removeItem = (idx) => setForm(f => ({ ...f, items: f.items.length > 1 ? f.items.filter((_, i) => i !== idx) : f.items }));

    // ── รหัสไปรษณีย์ → เติมจังหวัด/อำเภอ/ตำบล ──────────────────
    const postalEntry = form.postal.length === 5 ? C.POSTAL_DB[form.postal] : null;
    const addrLocked = form.postal.length !== 5;
    const districtOptions = postalEntry ? (postalEntry.d || []) : [];
    const subdistrictOptions = postalEntry ? (postalEntry.s || []) : [];

    const setPostal = (value) => {
        const postal = String(value).replace(/\D/g, "").slice(0, 5);
        setForm(f => {
            const next = { ...f, postal };
            if (postal.length === 5) {
                const e = C.POSTAL_DB[postal];
                if (e) {
                    const ds = e.d || [], ss = e.s || [];
                    next.province = e.p || "";
                    next.district = ds.length === 1 ? ds[0] : (ds.includes(f.district) ? f.district : "");
                    next.subdistrict = ss.length === 1 ? ss[0] : (ss.includes(f.subdistrict) ? f.subdistrict : "");
                    next.customDistrict = false; next.customSubdistrict = false;
                }
            } else if (f.postal.length === 5) {
                next.province = ""; next.district = ""; next.subdistrict = "";
                next.customDistrict = false; next.customSubdistrict = false;
            }
            return next;
        });
    };
    const setSelectField = (field, customFlag, value) => {
        if (value === C.CUSTOM) setForm(f => ({ ...f, [field]: "", [customFlag]: true }));
        else setForm(f => ({ ...f, [field]: value }));
    };

    const parsePasted = () => {
        const p = C.parsePastedText(pasteText);
        if (!p) return;
        const entry = C.POSTAL_DB[p.postal];
        setForm(f => {
            const next = { ...f, customerName: p.name || f.customerName, phone: p.phone || f.phone };
            if (p.addrLine) next.addrLine = p.addrLine;
            if (p.postal) {
                next.postal = p.postal;
                next.province = p.province || f.province;
                next.district = p.district || f.district;
                next.subdistrict = p.subdistrict || f.subdistrict;
                next.customDistrict = !!(next.district && (!entry || !(entry.d || []).includes(next.district)));
                next.customSubdistrict = !!(next.subdistrict && (!entry || !(entry.s || []).includes(next.subdistrict)));
            }
            return next;
        });
        setPasteText("");
        setShowMissing(true);
    };

    const missing = C.getMissing(form);
    const missingLabels = C.missingLabelsOf(missing);
    const markCls = (key, base) => base + (showMissing && missing[key] ? " !border-red-400 !bg-red-50" : "");
    const addrPreview = C.composeAddress(form);

    const inputCls = "w-full px-4 py-3 rounded-2xl border-2 border-slate-200 outline-none font-bold text-slate-700 bg-white transition-all focus:border-brand-600";
    const numCls = "w-full px-1 py-3 rounded-2xl border-2 border-slate-200 outline-none font-bold text-slate-700 bg-white text-center transition-all focus:border-brand-600";

    // ── ส่งข้อมูล ────────────────────────────────────────────────
    const submit = async () => {
        if (missingLabels.length > 0) { setShowMissing(true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        if (!consent) { setErrorMsg("กรุณายอมรับการเก็บข้อมูลก่อนส่ง"); return; }
        setStatus("sending"); setErrorMsg("");
        try {
            const user = auth.currentUser;
            const ref = String(Date.now()).slice(-6);
            const order = Object.assign(C.formToOrder({ ...form, no: ref }), {
                status: "pending",
                source: "customer",
                uid: user ? user.uid : null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            const doc = await db.collection("orders").add(order);

            // แจ้งเตือนเข้าไลน์แอดมิน (ถ้าไม่ได้ตั้งค่าไว้ก็ข้าม)
            if (CFG.lineWorkerUrl) {
                try {
                    const idToken = await user.getIdToken();
                    await fetch(CFG.lineWorkerUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain" },   // เลี่ยง CORS preflight
                        body: JSON.stringify({ docId: doc.id, idToken })
                    });
                } catch (e) { /* แจ้งเตือนพลาดไม่ควรทำให้ลูกค้าเห็น error */ }
            }

            setRefNo(ref);
            setStatus("done");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            setErrorMsg(e.message || "ส่งข้อมูลไม่สำเร็จ");
            setStatus("error");
        }
    };

    const startNew = () => {
        setForm(C.emptyForm()); setShowMissing(false); setConsent(false);
        setStatus("idle"); setRefNo(""); setErrorMsg("");
    };

    // ── หน้าจอหลังส่งสำเร็จ ──────────────────────────────────────
    if (status === "done") {
        return (
            <div className="p-4 md:p-8 flex justify-center">
                <div className="max-w-lg w-full bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 text-center">
                    <div className="text-6xl mb-3">✅</div>
                    <h1 className="text-2xl font-black text-slate-800 mb-2">ส่งข้อมูลเรียบร้อยแล้ว</h1>
                    <p className="text-slate-500 font-medium mb-6">ร้านได้รับข้อมูลของคุณแล้ว กำลังตรวจสอบและจัดส่งให้เร็วที่สุด</p>
                    <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl py-5 mb-6">
                        <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">เลขอ้างอิง</div>
                        <div className="text-4xl font-black text-slate-800 tracking-widest mt-1">{refNo}</div>
                    </div>
                    <button onClick={startNew} className="px-8 py-4 rounded-2xl bg-brand-600 text-white font-black hover:bg-brand-700 transition-all shadow-lg">
                        กรอกอีกรายการ
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="p-4 md:p-8 flex justify-center" ref={topRef}>
            <div className="max-w-3xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200">

                <div className="p-8 text-center bg-brand-600 border-b border-brand-700">
                    <h1 className="text-2xl md:text-3xl font-black text-white flex items-center justify-center gap-3">
                        <span className="text-4xl">📮</span> กรอกข้อมูลจัดส่ง
                    </h1>
                    <p className="font-bold text-sm mt-1 text-brand-100">{CFG.shopName}</p>
                </div>

                <div className="p-6 md:p-8 space-y-5">
                    {/* วางข้อมูลทั้งก้อน */}
                    <div className="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-4">
                        <label className="block text-[10px] text-slate-400 font-black uppercase mb-2 tracking-widest">วางข้อมูลทั้งก้อน (ไม่บังคับ)</label>
                        <div className="flex flex-col md:flex-row gap-3">
                            <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} rows={3}
                                placeholder={"เช่น\nสมชาย ใจดี\n089-123-4567\n99/1 หมู่ 2 ต.บางรัก อ.เมือง จ.นนทบุรี 11000"}
                                className="flex-1 px-4 py-3 rounded-2xl border-2 border-slate-200 outline-none font-medium text-slate-700 resize-y focus:border-brand-600"/>
                            <button onClick={parsePasted} className="px-6 py-3 rounded-2xl bg-brand-600 text-white font-black hover:bg-brand-700 transition-all shadow active:scale-95 whitespace-nowrap">
                                ✨ แยกข้อมูลให้
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="md:col-span-3">
                            <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">ชื่อผู้รับ *</label>
                            <input value={form.customerName} onChange={e => setField('customerName', e.target.value)} placeholder="สมชาย ใจดี" className={markCls('customerName', inputCls)}/>
                        </div>
                        <div>
                            <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">เบอร์โทร *</label>
                            <input value={form.phone} onChange={e => setField('phone', e.target.value)} placeholder="0891234567" inputMode="numeric" className={markCls('phone', inputCls)}/>
                        </div>

                        <div>
                            <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">รหัสไปรษณีย์ *</label>
                            <input value={form.postal} onChange={e => setPostal(e.target.value)} placeholder="11000" inputMode="numeric" maxLength={5}
                                className={markCls('postal', inputCls) + " tracking-[0.3em] text-lg"}/>
                            <p className={`text-[10px] font-bold mt-1 ${form.postal.length === 5 ? (postalEntry ? "text-emerald-600" : "text-amber-600") : "text-slate-400"}`}>
                                {form.postal.length !== 5 ? "กรอกก่อน แล้วจังหวัด/อำเภอ/ตำบล จะขึ้นให้เลือก"
                                    : postalEntry ? "✓ พบในระบบ" : "⚠ ไม่พบรหัสนี้ — กรอกเอง"}
                            </p>
                        </div>
                        <div>
                            <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">จังหวัด *</label>
                            <select value={form.province} onChange={e => setField('province', e.target.value)} disabled={addrLocked || !!postalEntry}
                                className={markCls('province', inputCls) + " appearance-none disabled:bg-slate-50 disabled:text-slate-400"}>
                                <option value="">{addrLocked ? "— กรอกรหัสไปรษณีย์ก่อน —" : "— เลือกจังหวัด —"}</option>
                                {(postalEntry ? [postalEntry.p] : C.ALL_PROVINCES).map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="flex items-center justify-between text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">
                                <span>อำเภอ / เขต *</span>
                                {form.customDistrict && districtOptions.length > 0 && (
                                    <button onClick={() => setForm(f => ({ ...f, customDistrict: false, district: "" }))} className="text-slate-400 hover:text-slate-600 normal-case tracking-normal font-bold">↩ เลือกจากรายการ</button>
                                )}
                            </label>
                            {addrLocked ? (
                                <select disabled className={markCls('district', inputCls) + " appearance-none disabled:bg-slate-50 disabled:text-slate-400"}>
                                    <option>— กรอกรหัสไปรษณีย์ก่อน —</option>
                                </select>
                            ) : (!form.customDistrict && districtOptions.length > 0) ? (
                                <select value={form.district} onChange={e => setSelectField('district', 'customDistrict', e.target.value)} className={markCls('district', inputCls) + " appearance-none"}>
                                    <option value="">— เลือกอำเภอ/เขต —</option>
                                    {districtOptions.map(d => <option key={d} value={d}>{form.province === "กรุงเทพมหานคร" ? `เขต${d}` : d}</option>)}
                                    <option value={C.CUSTOM}>+ พิมพ์เอง…</option>
                                </select>
                            ) : (
                                <input value={form.district} onChange={e => setField('district', e.target.value)} placeholder="เมืองนนทบุรี" className={markCls('district', inputCls)}/>
                            )}
                        </div>
                        <div>
                            <label className="flex items-center justify-between text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">
                                <span>ตำบล / แขวง *</span>
                                {form.customSubdistrict && subdistrictOptions.length > 0 && (
                                    <button onClick={() => setForm(f => ({ ...f, customSubdistrict: false, subdistrict: "" }))} className="text-slate-400 hover:text-slate-600 normal-case tracking-normal font-bold">↩ เลือกจากรายการ</button>
                                )}
                            </label>
                            {addrLocked ? (
                                <select disabled className={markCls('subdistrict', inputCls) + " appearance-none disabled:bg-slate-50 disabled:text-slate-400"}>
                                    <option>— กรอกรหัสไปรษณีย์ก่อน —</option>
                                </select>
                            ) : (!form.customSubdistrict && subdistrictOptions.length > 0) ? (
                                <select value={form.subdistrict} onChange={e => setSelectField('subdistrict', 'customSubdistrict', e.target.value)} className={markCls('subdistrict', inputCls) + " appearance-none"}>
                                    <option value="">— เลือกตำบล/แขวง —</option>
                                    {subdistrictOptions.map(s => <option key={s} value={s}>{s}</option>)}
                                    <option value={C.CUSTOM}>+ พิมพ์เอง…</option>
                                </select>
                            ) : (
                                <input value={form.subdistrict} onChange={e => setField('subdistrict', e.target.value)} placeholder="บางรัก" className={markCls('subdistrict', inputCls)}/>
                            )}
                        </div>
                        <div className="md:col-span-4">
                            <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">ที่อยู่ (บ้านเลขที่ หมู่ ซอย ถนน) *</label>
                            <textarea value={form.addrLine} onChange={e => setField('addrLine', e.target.value)} rows={2}
                                placeholder="99/1 หมู่ 2 ซอยสุขใจ ถนนติวานนท์" className={markCls('addrLine', inputCls) + " resize-y"}/>
                        </div>
                    </div>

                    {addrPreview && (
                        <div className="bg-white border-2 border-slate-200 rounded-2xl px-4 py-3">
                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">ที่อยู่ที่จะใช้: </span>
                            <span className="font-bold text-slate-700 text-sm">{addrPreview}</span>
                        </div>
                    )}

                    {/* พัสดุ */}
                    <div className="bg-white border-2 border-slate-200 rounded-2xl px-4 py-4">
                        <div className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">📦 พัสดุ (ทั้งกล่อง)</div>
                        <div className="flex flex-wrap items-end gap-4">
                            <div>
                                <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">น้ำหนัก (กก.) *</label>
                                <input type="number" step="0.01" min="0" value={form.weight} onChange={e => setField('weight', e.target.value)} placeholder="0.00" className={markCls('weight', numCls) + " w-28"}/>
                            </div>
                            <div>
                                <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">กว้าง × ยาว × สูง (ซม.) *</label>
                                <div className="flex items-center gap-2">
                                    <input type="number" min="0" value={form.width} onChange={e => setField('width', e.target.value)} placeholder="กว้าง" className={markCls('width', numCls) + " w-20"}/>
                                    <span className="text-slate-300 font-black">×</span>
                                    <input type="number" min="0" value={form.length} onChange={e => setField('length', e.target.value)} placeholder="ยาว" className={markCls('length', numCls) + " w-20"}/>
                                    <span className="text-slate-300 font-black">×</span>
                                    <input type="number" min="0" value={form.height} onChange={e => setField('height', e.target.value)} placeholder="สูง" className={markCls('height', numCls) + " w-20"}/>
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">ประเภทสินค้า</label>
                                <select value={form.itemType} onChange={e => setField('itemType', e.target.value)} className={inputCls + " appearance-none w-44"}>
                                    {C.ITEM_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* COD */}
                    <div className={`flex flex-wrap items-center gap-4 border-2 rounded-2xl px-4 py-3 transition-all ${form.isCod ? "bg-emerald-50 border-emerald-300" : "bg-white border-slate-200"}`}>
                        <label className="flex items-center gap-3 cursor-pointer select-none">
                            <input type="checkbox" checked={form.isCod}
                                onChange={e => setForm(f => ({ ...f, isCod: e.target.checked, amount: e.target.checked ? f.amount : "" }))}
                                className="w-5 h-5 accent-emerald-500 cursor-pointer"/>
                            <span className="font-black text-slate-700">💰 เก็บเงินปลายทาง (COD)</span>
                        </label>
                        {form.isCod ? (
                            <div className="flex items-center gap-2">
                                <input type="number" value={form.amount} onChange={e => setField('amount', e.target.value)} placeholder="0"
                                    className={"w-40 px-4 py-2.5 rounded-xl border-2 outline-none font-black text-slate-800 bg-white text-lg " + (showMissing && missing.amount ? "border-red-400 bg-red-50" : "border-emerald-300")}/>
                                <span className="font-bold text-slate-400 text-sm">บาท</span>
                            </div>
                        ) : (
                            <span className="text-slate-400 text-xs font-bold">ไม่ใช่ COD — ยอดเงินและรายการสินค้าไม่ต้องกรอกก็ได้</span>
                        )}
                    </div>

                    {/* รายการสินค้า */}
                    <div>
                        <label className="block text-[10px] text-slate-400 font-black uppercase mb-2 tracking-widest">
                            รายการสินค้า {form.isCod ? "*" : <span className="text-slate-300">(ไม่บังคับ)</span>}
                        </label>
                        <div className="hidden md:grid grid-cols-[1fr_9rem_6rem_4rem_3rem] gap-2 px-2 mb-1 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <span>ชื่อสินค้า</span><span>สี / ตัวเลือก</span><span>ขนาด</span><span className="text-center">จำนวน</span><span></span>
                        </div>
                        <div className="space-y-2">
                            {form.items.map((it, idx) => (
                                <div key={idx} className="grid grid-cols-1 md:grid-cols-[1fr_9rem_6rem_4rem_3rem] gap-2">
                                    <input value={it.name} onChange={e => setItem(idx, 'name', e.target.value)} placeholder="ชื่อสินค้า" className={markCls('items', inputCls)}/>
                                    <input value={it.variant} onChange={e => setItem(idx, 'variant', e.target.value)} placeholder="สี / ตัวเลือก" className={inputCls}/>
                                    <input value={it.size} onChange={e => setItem(idx, 'size', e.target.value)} placeholder="เช่น M" className={inputCls}/>
                                    <input type="number" min="1" value={it.qty} onChange={e => setItem(idx, 'qty', e.target.value)} className={numCls}/>
                                    <button onClick={() => removeItem(idx)} disabled={form.items.length === 1}
                                        className="px-3 py-3 rounded-2xl border-2 border-slate-200 text-slate-400 font-black hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-all disabled:opacity-30">✕</button>
                                </div>
                            ))}
                        </div>
                        <button onClick={addItem} className="mt-2 px-5 py-2 rounded-xl border-2 border-slate-300 text-slate-600 font-black text-sm hover:bg-slate-100 transition-all">+ เพิ่มสินค้า</button>
                    </div>

                    {/* หมายเหตุถึงร้าน */}
                    <div>
                        <label className="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">หมายเหตุถึงร้าน (ไม่บังคับ)</label>
                        <textarea value={form.note} onChange={e => setField('note', e.target.value)} rows={2}
                            placeholder="เช่น ฝากไว้หน้าบ้านได้เลย / โทรก่อนส่ง" className={inputCls + " resize-y"}/>
                    </div>

                    {showMissing && missingLabels.length > 0 && (
                        <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-4 text-red-700 font-bold text-sm flex items-start gap-2">
                            <span className="text-xl leading-none">⚠️</span>
                            <span>ยังขาดข้อมูลที่ต้องกรอก ({missingLabels.length}) — ช่องสีแดง: {missingLabels.join(" · ")}</span>
                        </div>
                    )}
                    {errorMsg && (
                        <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 text-amber-800 font-bold text-sm flex items-center gap-2">
                            <span className="text-xl">⚠️</span> {errorMsg}
                        </div>
                    )}

                    {/* PDPA */}
                    <label className="flex items-start gap-3 cursor-pointer select-none bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
                        <input type="checkbox" checked={consent} onChange={e => { setConsent(e.target.checked); setErrorMsg(""); }} className="w-5 h-5 mt-0.5 accent-brand-600 cursor-pointer"/>
                        <span className="text-xs text-slate-500 font-medium">
                            ยินยอมให้ <b className="text-slate-700">{CFG.shopName}</b> เก็บและใช้ชื่อ เบอร์โทร และที่อยู่ของฉัน
                            เพื่อจัดส่งพัสดุนี้เท่านั้น และจะถูกลบเมื่อไม่จำเป็นต้องใช้แล้ว
                        </span>
                    </label>

                    <button onClick={submit} disabled={status === "sending" || !ready}
                        className="w-full px-10 py-5 rounded-[1.5rem] font-black uppercase text-lg transition-all shadow-xl active:scale-95 bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-50 disabled:active:scale-100">
                        {status === "sending" ? "กำลังส่ง…" : !ready ? "กำลังเชื่อมต่อ…" : "📤 ส่งข้อมูลให้ร้าน"}
                    </button>
                </div>
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
